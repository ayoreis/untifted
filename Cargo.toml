[package]
name = "untifted"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16.0"
glam = { version = "*", features = ["serde"] }
log = { version = "*", features = [
	"max_level_debug",
	"release_max_level_warn",
] }
serde = "*"
serde_json = "*"
thiserror = "*"

[dev-dependencies]
bevy = { version = "*", features = ["dynamic_linking"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
